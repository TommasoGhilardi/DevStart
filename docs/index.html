<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStart has moved!</title>
    <meta http-equiv="refresh" content="5;url=https://devstart.org">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-color: #f8f9fa;
            color: #495057;
            font-family: "Roboto", "Segoe UI", "Helvetica Neue", Helvetica, sans-serif;
            margin: 0;
        }
        .redirect-container {
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .logo {
            max-width: 250px;
            margin-bottom: 2rem;
        }
        .btn-redirect {
            background-color: #008080;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 1.5rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-redirect:hover {
            background-color: #00b3b3;
            color: white;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <img src="resources/LOGO.png" alt="DevStart Logo" class="logo">
        <h1>We have moved!</h1>
        <p>The DevStart documentation has mitigated to a new home. You will be automatically redirected to <strong>devstart.org</strong> in a few seconds.</p>
        <a href="https://devstart.org" class="btn-redirect">Go to devstart.org now</a>
    </div>
</body>
</html>
